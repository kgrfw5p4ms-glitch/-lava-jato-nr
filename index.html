<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lava Jato N&R</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#fff;font-family:Arial}
main{max-width:520px;margin:auto;padding:20px 16px 40px}
h1{text-align:center}h1 span{color:#28a9ff}
.card{background:#0d1b2d;border:1px solid #1b3550;border-radius:16px;padding:16px;margin:12px 0}
button,input{width:100%;padding:13px;border-radius:10px;font-size:16px}
button{background:#101f33;color:#fff;border:2px solid #1d3854;margin:5px 0}
button.selected{border-color:#25a9ff;background:#0d2941}
button:disabled{opacity:.3}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
input{background:#081525;color:#fff;border:1px solid #29445f;margin:5px 0}
.green{background:#19a765;border:0;font-weight:bold}
.red{background:#b52b2b;border:0;font-weight:bold}
.msg{text-align:center;color:#aebdce;font-size:13px}
</style>
</head>

<body>
<main>

<h1>LAVA JATO <span>N&R</span></h1>
<p class="msg">Agende sua lavagem aos finais de semana</p>

<div class="card">
<h3>1. Escolha o serviço</h3>

<button class="service" data-name="Lavagem simples - Carro pequeno" data-price="30" data-duration="60">
Lavagem simples — Carro pequeno — R$30
</button>

<button class="service" data-name="Lavagem simples - Carro grande" data-price="35" data-duration="90">
Lavagem simples — Carro grande — R$35
</button>

<button class="service" data-name="Lavagem completa - Carro pequeno" data-price="40" data-duration="90">
Lavagem completa — Carro pequeno — R$40
</button>

<button class="service" data-name="Lavagem completa - Carro grande" data-price="45" data-duration="120">
Lavagem completa — Carro grande — R$45
</button>
</div>

<div class="card">
<h3>2. Escolha o dia</h3>
<div id="days"></div>
</div>

<div class="card">
<h3>3. Escolha o horário</h3>
<div id="times" class="grid"></div>
</div>

<div class="card">
<h3>4. Seus dados</h3>
<input id="name" placeholder="Seu nome">
<input id="phone" placeholder="Seu WhatsApp">
<button id="confirm" class="green" disabled>
Confirmar pelo WhatsApp
</button>
</div>

<div class="card">
<h3>Cancelar minha lavagem</h3>

<input id="cancelPhone" placeholder="WhatsApp usado na reserva">

<button id="cancel" class="red">
Cancelar agendamento
</button>

<p id="cancelMsg" class="msg"></p>
</div>

</main>

<script>
"use strict";

const KEY="nr_bookings";
let service=null,day=null,time=null;

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");

function dateKey(d){
return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function dateLabel(d){
return ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][d.getDay()]
+" • "+pad(d.getDate())+"/"+pad(d.getMonth()+1);
}

function bookings(){
try{return JSON.parse(localStorage.getItem(KEY)||"[]")}
catch(e){return[]}
}

function save(x){
localStorage.setItem(KEY,JSON.stringify(x));
}

function isBooked(t){
return bookings().some(b=>b.date==dateKey(day)&&b.time==t);
}

/* DIAS */

let today=new Date();
today.setHours(0,0,0,0);

for(let i=0;i<21;i++){

let d=new Date(today);
d.setDate(today.getDate()+i);

if(d.getDay()==0||d.getDay()==6){

let b=document.createElement("button");
b.textContent=dateLabel(d);

b.onclick=()=>{
document.querySelectorAll("#days button")
.forEach(x=>x.classList.remove("selected"));

b.classList.add("selected");
day=d;
time=null;
$("confirm").disabled=true;
renderTimes();
};

$("days").appendChild(b);
}
}

/* SERVIÇOS */

document.querySelectorAll(".service").forEach(b=>{

b.onclick=()=>{

document.querySelectorAll(".service")
.forEach(x=>x.classList.remove("selected"));

b.classList.add("selected");

service={
name:b.dataset.name,
price:+b.dataset.price,
duration:+b.dataset.duration
};

time=null;
$("confirm").disabled=true;
renderTimes();

};

});

/* HORÁRIOS */

function renderTimes(){

$("times").innerHTML="";

if(!day||!service)return;

let close=day.getDay()==6?960:900;

for(let t=480;t+service.duration<=close;t+=30){

let h=pad(Math.floor(t/60))+":"+pad(t%60);

let b=document.createElement("button");
b.textContent=h;
b.disabled=isBooked(h);

b.onclick=()=>{

document.querySelectorAll("#times button")
.forEach(x=>x.classList.remove("selected"));

b.classList.add("selected");
time=h;
$("confirm").disabled=false;

};

$("times").appendChild(b);
}
}

/* AGENDAR */

$("confirm").onclick=()=>{

let name=$("name").value.trim();
let phone=$("phone").value.trim();

if(!service||!day||!time||!name||!phone){
alert("Preencha todos os dados.");
return;
}

if(isBooked(time)){
alert("Esse horário já foi reservado.");
renderTimes();
return;
}

let booking={
id:Date.now(),
name:name,
phone:phone,
service:service.name,
price:service.price,
date:dateKey(day),
dateText:dateLabel(day),
time:time
};

let all=bookings();
all.push(booking);
save(all);

let msg=
"Olá! Quero confirmar meu agendamento no Lava Jato.%0A%0A"+
"🚗 Serviço: "+encodeURIComponent(booking.service)+"%0A"+
"📅 Data: "+encodeURIComponent(booking.dateText)+"%0A"+
"🕐 Horário: "+encodeURIComponent(booking.time)+"%0A"+
"💰 Valor: R$ "+booking.price.toFixed(2).replace(".",",")+"%0A"+
"👤 Nome: "+encodeURIComponent(booking.name)+"%0A"+
"📱 WhatsApp: "+encodeURIComponent(booking.phone);

location.href=
"https://wa.me/5511965944083?text="+msg;
};

/* CANCELAR */

$("cancel").onclick=()=>{

let phone=$("cancelPhone").value.trim();

if(!phone){
$("cancelMsg").textContent=
"Digite o WhatsApp usado na reserva.";
return;
}

let all=bookings();

let minhas=all.filter(b=>
b.phone.replace(/\D/g,"")==
phone.replace(/\D/g,"")
);

if(!minhas.length){
$("cancelMsg").textContent=
"Nenhum agendamento encontrado para esse WhatsApp.";
return;
}

if(minhas.length==1){

let b=minhas[0];

if(confirm(
"Cancelar a lavagem de "+b.dateText+
" às "+b.time+"?"
)){

save(all.filter(x=>x.id!==b.id));

$("cancelMsg").textContent=
"Agendamento cancelado com sucesso.";

renderTimes();

}

return;
}

let texto="Foram encontrados vários agendamentos:\n\n";

minhas.forEach((b,i)=>{
texto+=(i+1)+" - "+b.dateText+" às "+b.time+"\n";
});

let escolha=prompt(
texto+"\nDigite o número do agendamento que deseja cancelar:"
);

let index=Number(escolha)-1;

if(minhas[index]){

save(all.filter(x=>x.id!==minhas[index].id));

$("cancelMsg").textContent=
"Agendamento cancelado com sucesso.";

renderTimes();

}else{

$("cancelMsg").textContent=
"Agendamento não encontrado.";

}

};
</script>

</body>
</html>
