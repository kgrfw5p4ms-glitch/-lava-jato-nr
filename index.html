<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lava Jato N&R</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:white;font-family:Arial}
main{max-width:520px;margin:auto;padding:20px 16px}
h1{text-align:center}h1 span{color:#28a9ff}
.card{background:#0d1b2d;border:1px solid #1b3550;border-radius:16px;padding:16px;margin:12px 0}
button,input{width:100%;padding:13px;border-radius:10px;font-size:16px}
button{background:#101f33;color:white;border:2px solid #1d3854;margin:5px 0}
button.selected{border-color:#25a9ff;background:#0d2941}
button:disabled{opacity:.3}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
input{background:#081525;color:white;border:1px solid #29445f;margin:5px 0}
#confirm{background:#19a765;border:0;font-weight:bold}
</style>
</head>
<body>

<main>

<h1>LAVA JATO <span>N&R</span></h1>

<div class="card">
<h3>1. Serviço</h3>

<button class="service" data-name="Lavagem simples - Carro pequeno" data-price="30" data-duration="60">
Lavagem simples — Carro pequeno — R$30
</button>

<button class="service" data-name="Lavagem simples - Carro grande" data-price="35" data-duration="90">
Lavagem simples — Carro grande — R$35
</button>

<button class="service" data-name="Lavagem completa - Carro pequeno" data-price="40" data-duration="90">
Lavagem completa — Carro pequeno — R$40
</button>

<button class="service" data-name="Lavagem completa - Carro grande" data-price="45" data-duration="120">
Lavagem completa — Carro grande — R$45
</button>
</div>

<div class="card">
<h3>2. Dia</h3>
<div id="days"></div>
</div>

<div class="card">
<h3>3. Horário</h3>
<div id="times" class="grid"></div>
</div>

<div class="card">
<h3>4. Seus dados</h3>
<input id="name" placeholder="Seu nome">
<input id="phone" placeholder="Seu WhatsApp">
<button id="confirm" disabled>Confirmar pelo WhatsApp</button>
</div>

</main>

<script>
"use strict";

/* RESET TEMPORÁRIO */
localStorage.removeItem("nr_bookings");
localStorage.removeItem("nr_bookings_v2");

let service=null,day=null,time=null;

const $=x=>document.getElementById(x);
const pad=x=>String(x).padStart(2,"0");

function key(d){
return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function label(d){
return ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][d.getDay()]
+" • "+pad(d.getDate())+"/"+pad(d.getMonth()+1);
}

function bookings(){
return JSON.parse(localStorage.getItem("nr_bookings_v2")||"[]");
}

function booked(t){
return bookings().some(x=>x.date==key(day)&&x.time==t);
}

let d=new Date();
d.setHours(0,0,0,0);

for(let i=0;i<21;i++){

let x=new Date(d);
x.setDate(d.getDate()+i);

if(x.getDay()==0||x.getDay()==6){

let b=document.createElement("button");
b.textContent=label(x);
b.onclick=()=>{

document.querySelectorAll("#days button").forEach(x=>x.classList.remove("selected"));

b.classList.add("selected");
day=x;
time=null;
renderTimes();

};

$("days").appendChild(b);

}
}

document.querySelectorAll(".service").forEach(b=>{

b.onclick=()=>{

document.querySelectorAll(".service").forEach(x=>x.classList.remove("selected"));

b.classList.add("selected");

service={
name:b.dataset.name,
price:+b.dataset.price,
duration:+b.dataset.duration
};

time=null;
renderTimes();

};

});

function renderTimes(){

$("times").innerHTML="";

if(!day||!service)return;

let close=day.getDay()==6?960:900;

for(let t=480;t+service.duration<=close;t+=30){

let h=pad(Math.floor(t/60))+":"+pad(t%60);

let b=document.createElement("button");

b.textContent=h;
b.disabled=booked(h);

b.onclick=()=>{

document.querySelectorAll("#times button").forEach(x=>x.classList.remove("selected"));

b.classList.add("selected");
time=h;
$("confirm").disabled=false;

};

$("times").appendChild(b);

}

}

$("confirm").onclick=()=>{

if(!service||!day||!time||!$("name").value||!$("phone").value)
return alert("Preencha todos os dados.");

let booking={
name:$("name").value,
phone:$("phone").value,
service:service.name,
price:service.price,
date:key(day),
time:time
};

let all=bookings();
all.push(booking);

localStorage.setItem("nr_bookings_v2",JSON.stringify(all));

let msg=
"Olá! Quero confirmar meu agendamento no Lava Jato.%0A%0A"+
"🚗 Serviço: "+encodeURIComponent(booking.service)+"%0A"+
"📅 Data: "+encodeURIComponent(label(day))+"%0A"+
"🕐 Horário: "+encodeURIComponent(time)+"%0A"+
"💰 Valor: R$ "+booking.price.toFixed(2).replace(".",",")+"%0A"+
"👤 Nome: "+encodeURIComponent(booking.name)+"%0A"+
"📱 WhatsApp: "+encodeURIComponent(booking.phone);

location.href="https://wa.me/5511965944083?text="+msg;

};
</script>

</body>
</html>
